<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class = "bg-amber-400 p-6">
    {{led_status}}
    <div class = "max-w-4xl mx-auto">
        
        <h1 class = "text-2xl font-bold text-emerald-600 ">Painel de Controle</h1>

        <div class = "grid grid-cols-2 gap-4">

            <div class = "bg-red-500">
                <h2 class = "text-xl font-bold text-sky-600 ">Pombão</h2>
                <p>O pombão é a ave mais popular do mundo. É muita Aura!!!🗿🤫🧏‍♂️🥶</p>
            </div>

            <div class = "bg-red-500">
                <h2 class = "text-xl font-bold text-sky-600 ">Alexa</h2>
                <p>Alexa é a assistente Pombão. Ela liga a sua Aura.🗿📈</p>
            </div>

            <div class = "bg-red-500">
                <h2 class = "text-xl font-bold text-sky-600 ">CR7</h2>
                <p>CR7 é a pessoa mais aurosa do mundo.🗣️Siuuuuuuuuu</p>
            </div>

            <div class = "bg-lime-700">
                <h2 class = "text-xl font-bold text-pink-600 ">Visitas</h2>
                <p>{{ visitas }}</p>
            </div>

            <div class = "bg-lime-700">
                <h2 class = "text-xl font-bold text-pink-600 ">Eduardo</h2>
                <p>{{ curiosidade }}</p>
            </div>

        </div>

    </div>


  </body>
</html>
